<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ze-token" content="__TOKEN__">
<meta name="ze-ajustes" content="__AJUSTES__">
<title>Zé</title>
<link rel="stylesheet" href="/painel.css">
<link rel="icon" type="image/webp" href="/ze.webp">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#070c11">
<script src="/painel.js" defer></script>
<script src="/modulos/voz.js" defer></script>

<div class="app">

    <nav aria-label="Seções">
      <a href="#inicio" data-secao="inicio"><i>◉</i>Início</a>
      <a href="#conversa" data-secao="conversa"><i>❝</i>Conversa</a>
      <a href="#imersao" data-secao="imersao"><i>◐</i>Imersão <span class="ponto" id="ponto-imersao" hidden></span></a>
      <div class="grupo" data-grupo="trabalho">

      </div>
      <div class="grupo" data-grupo="ze">
        <button type="button" class="grupo-titulo" data-acao="grupo" aria-expanded="true">O Zé<i class="seta" aria-hidden="true">▾</i></button>
        <div class="grupo-itens">

        <button type="button" class="grupo-titulo" data-acao="grupo" aria-expanded="true">Ajustes<i class="seta" aria-hidden="true">▾</i></button>

          <a href="#perfil" data-secao="perfil"><i>◌</i>Perfil</a>
          <a href="#modelos" data-secao="modelos"><i>◎</i>Modelos</a>

  <main id="conteudo" tabindex="-1" aria-live="polite"></main>
