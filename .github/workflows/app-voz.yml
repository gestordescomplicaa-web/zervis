# O app de voz do Android (android/README.md): compilado aqui, porque quem desenvolve não precisa
# do Android SDK. Num PR, o APK fica como artefato para testar; na master, vai para a versão
# "app-voz" do repositório, num endereço fixo que o celular baixa direto:
# https://github.com/<dono>/<repo>/releases/download/app-voz/ze-voz.apk
# A chave que assina fica nos segredos (ZE_VOZ_KEYSTORE_B64, ZE_VOZ_SENHA): sempre a mesma, cada
# versão instala por cima da anterior. Sem ela (um fork), sai um APK de depuração.
# Ações fixadas pelo commit (a etiqueta fica no comentário), como no check.yml.
name: app-voz

on:
  push:
    branches: [master]
    paths: ["android/**", ".github/workflows/app-voz.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/app-voz.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-voz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # só a publicação na master usa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.2"

      - name: Chave de assinatura
        env:
          LOJA_B64: ${{ secrets.ZE_VOZ_KEYSTORE_B64 }}
        run: |
          if [ -n "$LOJA_B64" ]; then
            printf '%s' "$LOJA_B64" | base64 -d > "$RUNNER_TEMP/ze-voz.p12"
            echo "ZE_VOZ_KEYSTORE=$RUNNER_TEMP/ze-voz.p12" >> "$GITHUB_ENV"
          fi

      - name: Compilar
        working-directory: android
        env:
          VERSAO_CODIGO: ${{ github.run_number }}
          ZE_VOZ_SENHA: ${{ secrets.ZE_VOZ_SENHA }}
        run: |
          if [ -n "${ZE_VOZ_KEYSTORE:-}" ]; then
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ze-voz.apk"
          else
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/ze-voz.apk"
          fi
          ls -l "$RUNNER_TEMP/ze-voz.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ze-voz
          path: ${{ runner.temp }}/ze-voz.apk

      - name: Publicar na versão app-voz
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.ZE_VOZ_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view app-voz >/dev/null 2>&1; then
            gh release create app-voz --prerelease --title "Zé Voz: o app de voz do Android" \
              --notes "Baixe ze-voz.apk no celular e instale. Pareie no painel do Zé: Voz → App de voz. Veja android/README.md."
          fi
          gh release upload app-voz "$RUNNER_TEMP/ze-voz.apk" --clobber
