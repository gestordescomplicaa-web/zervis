# A porta de qualidade (docs/06-qualidade.md) a cada envio, numa máquina que não é a de quem
# desenvolve: formatação, lint, tipos (Python e JavaScript), testes com o painel num Chromium de
# verdade e os testes do Go. Teste pulado é falha (ZE_SEM_PULOS=1): a prova não some sem aviso.
# Ações fixadas pelo commit (a etiqueta fica no comentário); atualizar é um commit próprio.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ZE_SEM_PULOS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: zervis/atendimento/wacalls/go.mod
          cache-dependency-path: zervis/atendimento/wacalls/go.sum

      # Os modelos de som (~100 MB) mudam só com zervis/preparar.py, que guarda os SHA-256.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/zervis/modelos
          key: modelos-${{ hashFiles('zervis/preparar.py') }}

      - name: Dependências
        run: uv sync --frozen

      - name: Modelos de som
        run: uv run python -m zervis.preparar

      # O Ubuntu 24.04 restringe namespaces de usuário sem perfil do AppArmor, e o sandbox do
      # Chromium aborta ao abrir. Liberar só na máquina da CI, sem tirar o sandbox do navegador.
      - name: Chromium
        # Uma abertura antes dos testes: a primeira, a frio, passou de 15 s na CI (16/10/2026).
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          navegador=$(command -v chromium || command -v chromium-browser \
            || command -v google-chrome || command -v google-chrome-stable)
          echo "$navegador"
          timeout 120 "$navegador" --headless=new --dump-dom about:blank > /dev/null

      # As sessões protegidas (ADR 0074) rodam no bubblewrap; o aceite delas não pode ser pulado.
      # Os espelhos do Ubuntu da própria máquina do GitHub (azure.archive, security) às vezes ficam
      # sem DNS (11/11/2026, uma manhã inteira), e cada máquina alcança uns espelhos e não outros:
      # então todo o apt desta máquina (este passo e o instalador, adiante) passa para o primeiro
      # espelho oficial que responder, por IPv4. O apt confere a assinatura do Ubuntu do mesmo jeito.
      - name: Bubblewrap
        run: |
          apt_rapido="-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          if ! { sudo apt-get $apt_rapido update && sudo apt-get $apt_rapido install -y --no-install-recommends bubblewrap; }; then
            versao=$(. /etc/os-release && echo "$VERSION_CODENAME")
            sudo mv /etc/apt/sources.list.d/ubuntu.sources /etc/apt/ubuntu.sources.fora 2>/dev/null || true
            echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99ipv4
            for espelho in http://us.archive.ubuntu.com/ubuntu http://mirrors.edge.kernel.org/ubuntu \
                http://mirrors.mit.edu/ubuntu http://mirror.math.princeton.edu/pub/ubuntu; do
              curl -4 -fsS -m 20 -o /dev/null "$espelho/dists/$versao/InRelease" || continue
              echo "::warning::Espelhos do Ubuntu da máquina fora do ar; o apt passa a usar $espelho."
              for parte in "" -updates -security -backports; do
                echo "deb $espelho ${versao}${parte} main restricted universe multiverse"
              done | sudo tee /etc/apt/sources.list
              sudo apt-get $apt_rapido update && sudo apt-get install -y --no-install-recommends bubblewrap && break
            done
          fi
          bwrap --ro-bind / / --dev /dev true

      - name: make check
        run: |
          set -o pipefail
          make check 2>&1 | tee "$RUNNER_TEMP/check.log"

      # Ubuntu limpo com sessão gráfica virtual e systemd real. Não usa contas nem áudio físico.
      - name: Instalador de PC
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          Xvfb :99 -screen 0 1400x900x24 > "$RUNNER_TEMP/tela.log" 2>&1 &
          export DISPLAY=:99 PAINEL_DEPURACAO=9336
          # Espera o servidor gráfico antes de abrir o navegador.
          for tentativa in $(seq 1 30); do
            if xdpyinfo -display :99 > /dev/null 2>&1; then break; fi
            sleep 1
          done
          xdpyinfo -display :99 > /dev/null
          # --desenvolvimento: a CI prova o código deste commit, não a versão publicada.
          timeout 600 deploy/instalar-pc.sh --desenvolvimento 2>&1 | tee "$RUNNER_TEMP/instalador.log"
          # No PC, o Zé é um programa (ADR 0079): ligado agora, sem ligar sozinho no login.
          ! systemctl --user is-enabled --quiet zervis
          systemctl --user is-active zervis
          test -f "$HOME/.local/share/applications/zervis.desktop"
          uv run python - <<'PY'
          import json
          import time
          import urllib.request
          # A porta de depuração pode abrir antes da aba; a configuração inicial usa #configurar.
          for tentativa in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:9336/json/list", timeout=2) as r:
                      abas = json.load(r)
                  if any(a.get("url", "").split("#")[0] == "http://127.0.0.1:8795/" for a in abas):
                      break
              except (OSError, ValueError):
                  pass
              time.sleep(0.5)
          else:
              raise RuntimeError("O instalador não abriu a aba do painel local.")
          PY

      - name: Registro da instalação
        if: failure()
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          journalctl --user -u zervis -n 80 --no-pager || true

      # O resumo da falha também como anotação: aparece na página do envio e pela API do GitHub.
      - name: Resumo da falha
        if: failure()
        run: |
          resumo=$(grep -E '^(FAILED|ERROR) |^E  |rror|make: \*\*\*|ZE_SEM_PULOS|SKIPPED' \
            "$RUNNER_TEMP/check.log" | head -60 || true)
          resumo="${resumo//'%'/'%25'}"
          resumo="${resumo//$'\n'/'%0A'}"
          echo "::error title=make check::${resumo:-sem detalhes no registro}"
