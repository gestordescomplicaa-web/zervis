# A porta de qualidade (docs/06-qualidade.md) a cada envio, numa máquina que não é a de quem
# desenvolve: formatação, lint, tipos (Python e JavaScript), testes com o painel num Chromium de
# verdade e os testes do Go. Teste pulado é falha (ZE_SEM_PULOS=1): a prova não some sem aviso.
# Ações fixadas pelo commit (a etiqueta fica no comentário); atualizar é um commit próprio.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ZE_SEM_PULOS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: jarvis/atendimento/wacalls/go.mod
          cache-dependency-path: jarvis/atendimento/wacalls/go.sum

      # Os modelos de som (~100 MB) mudam só com jarvis/preparar.py, que guarda os SHA-256.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/zervis/modelos
          key: modelos-${{ hashFiles('jarvis/preparar.py') }}

      - name: Dependências
        run: uv sync --frozen

      - name: Modelos de som
        run: uv run python -m jarvis.preparar

      # O Ubuntu 24.04 restringe namespaces de usuário sem perfil do AppArmor, e o sandbox do
      # Chromium aborta ao abrir. Liberar só na máquina da CI, sem tirar o sandbox do navegador.
      - name: Chromium
        # Uma abertura antes dos testes: a primeira, a frio, passou de 15 s na CI (16/10/2026).
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          navegador=$(command -v chromium || command -v chromium-browser \
            || command -v google-chrome || command -v google-chrome-stable)
          echo "$navegador"
          timeout 120 "$navegador" --headless=new --dump-dom about:blank > /dev/null

      - name: make check
        run: |
          set -o pipefail
          make check 2>&1 | tee "$RUNNER_TEMP/check.log"

      # Ubuntu limpo com sessão gráfica virtual e systemd real. Não usa contas nem áudio físico.
      - name: Instalador de PC
        run: |
          set -o pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          Xvfb :99 -screen 0 1400x900x24 > "$RUNNER_TEMP/tela.log" 2>&1 &
          export DISPLAY=:99 PAINEL_DEPURACAO=9336
          # Espera o servidor gráfico antes de abrir o navegador.
          for tentativa in $(seq 1 30); do
            if xdpyinfo -display :99 > /dev/null 2>&1; then break; fi
            sleep 1
          done
          xdpyinfo -display :99 > /dev/null
          timeout 600 deploy/instalar-pc.sh 2>&1 | tee "$RUNNER_TEMP/instalador.log"
          systemctl --user is-enabled zervis
          systemctl --user is-active zervis
          test -f "$HOME/.local/share/applications/zervis.desktop"
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused --max-time 5 \
            http://127.0.0.1:9336/json/list -o "$RUNNER_TEMP/abas.json"
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          abas = json.loads((Path(os.environ["RUNNER_TEMP"]) / "abas.json").read_text())
          assert any(a.get("url") == "http://127.0.0.1:8795/" for a in abas), abas
          PY

      - name: Registro da instalação
        if: failure()
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          journalctl --user -u zervis -n 80 --no-pager || true

      # O resumo da falha também como anotação: aparece na página do envio e pela API do GitHub.
      - name: Resumo da falha
        if: failure()
        run: |
          resumo=$(grep -E '^(FAILED|ERROR) |^E  |rror|make: \*\*\*|ZE_SEM_PULOS|SKIPPED' \
            "$RUNNER_TEMP/check.log" | head -60 || true)
          resumo="${resumo//'%'/'%25'}"
          resumo="${resumo//$'\n'/'%0A'}"
          echo "::error title=make check::${resumo:-sem detalhes no registro}"
