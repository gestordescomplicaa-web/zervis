[project]
name = "zervis"
version = "0.0.1"
description = "Zé (Zérvis): assistente pessoal local por voz, com memória, skills, automações e agentes de código."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
# Dependências de execução entram fase a fase, sempre com versão exata (docs/06-qualidade.md).
dependencies = [
    "claude-agent-sdk==0.2.163",
    "livekit>=1.1.20",
    "numpy==2.4.3",
    "onnxruntime==1.27.0",
    # A voz (Cadu) roda dentro do Zé: GPL-3, compatível com a AGPL do projeto (ADR 0013).
    "piper-tts==1.4.2",
    "websockets==17.2",
]

[project.scripts]
zervis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Scripts do Blender (rodam dentro dele, com o bpy), a página do modo imersivo e os testes dela
# no Chromium (JavaScript dentro de strings; rodam à parte, em make check-imersivo).
extend-exclude = ["jarvis/imersivo/web", "tests/imersivo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# assert é o idioma do pytest
"tests/**" = ["S101"]
# Normalizador de fala: "×", "–" e afins são justamente o que ele reconhece na tela.
"jarvis/voz/fala.py" = ["RUF001"]
"tests/test_fala.py" = ["RUF001", "E501"]
# Modo imersivo: cada leitura de estado falha em silêncio de propósito (sem arquivo, o anel só
# respira); o servidor nunca derruba a página por um arquivo ausente.
"jarvis/imersivo/servidor.py" = ["S110"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jarvis", "tests"]
exclude = ["jarvis/imersivo/web/", "tests/imersivo/"]

[[tool.mypy.overrides]]
# onnxruntime não publica tipos.
module = ["onnxruntime"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

