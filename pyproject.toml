[project]
name = "zervis"
version = "0.0.1"
description = "Zé (Zérvis): assistente pessoal local por voz, com memória, skills, automações e agentes de código."
readme = "README.md"
requires-python = ">=3.12,<3.15"
# Dependências de execução entram fase a fase, sempre com versão exata (docs/06-qualidade.md).
dependencies = [
    "claude-agent-sdk==0.2.163",
    "numpy==2.4.3",
    "onnxruntime==1.27.0",
    "websockets==17.2",
]

[project.scripts]
zervis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# assert é o idioma do pytest
"tests/**" = ["S101"]
# Normalizador de fala: "×", "–" e afins são justamente o que ele reconhece na tela.
"jarvis/voz/fala.py" = ["RUF001"]
"tests/test_fala.py" = ["RUF001", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jarvis", "tests"]

[[tool.mypy.overrides]]
# onnxruntime não publica tipos.
module = ["onnxruntime"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

